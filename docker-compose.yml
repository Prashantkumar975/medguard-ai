services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: medguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: medguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medguard -d medguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://medguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/medguard
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@medguard.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-nebius}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.tokenfactory.us-central1.nebius.com/v1/}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      OLLAMA_BASE_URL: http://ollama:11434
      ALLOW_LOCAL_TARGETS: "false"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://medguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/medguard
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-nebius}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.tokenfactory.us-central1.nebius.com/v1/}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }

  beat:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://medguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/medguard
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Optional local inference: use --profile local-llm and set LLM_PROVIDER=ollama.
  ollama:
    image: ollama/ollama:latest
    profiles: [local-llm]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  pgdata:
  ollama:
